<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jadwal Kuliah UNPAM - 07TPLE004</title>
    <style>
      /* THEME VARIABLES (DARK MODE DEFAULT) */
      :root {
        --bg: #0f172a;
        --card-bg: #1e293b;
        --card-passed: #0b1120;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --border: #334155;
        --primary: #3b82f6;
        --success: #22c55e;
        --radius: 12px;
        --icon-bg: #334155;
      }

      /* LIGHT MODE OVERRIDE */
      body.light-mode {
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --card-passed: #e2e8f0;
        --text: #0f172a;
        --text-muted: #64748b;
        --border: #e2e8f0;
        --primary: #2563eb;
        --success: #16a34a;
        --icon-bg: #f1f5f9;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      body {
        background-color: var(--bg);
        color: var(--text);
        padding: 30px 16px;
        line-height: 1.5;
        transition:
          background-color 0.3s,
          color 0.3s;
      }
      .container {
        max-width: 720px;
        margin: 0 auto;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 16px;
      }
      h1 {
        font-size: 1.3rem;
        font-weight: 700;
        color: var(--primary);
      }
      .sub-title {
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      .header-controls {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .btn-theme,
      .btn-reset-user {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 0.75rem;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s;
      }
      .btn-theme:hover {
        background: var(--icon-bg);
      }
      .btn-reset-user {
        border-color: #ef4444;
        color: #ef4444;
      }
      .btn-reset-user:hover {
        background: rgba(239, 68, 68, 0.1);
      }

      .pekan-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 12px;
      }
      .pekan-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        cursor: pointer;
        transition: all 0.2s;
        text-align: center;
        position: relative;
      }
      .pekan-card:hover {
        border-color: var(--primary);
        transform: translateY(-2px);
      }

      /* STYLE UNTUK PEKAN YANG SUDAH LEWAT */
      .pekan-card.passed {
        background: var(--card-passed);
        opacity: 0.75;
        border-style: dashed;
      }
      .pekan-card.passed::after {
        content: "✓ Lewat";
        position: absolute;
        top: 6px;
        right: 8px;
        font-size: 0.65rem;
        color: var(--text-muted);
        font-weight: 600;
      }

      .pekan-num {
        font-weight: 700;
        font-size: 1.1rem;
      }
      .pekan-date {
        font-size: 0.75rem;
        color: var(--primary);
        font-weight: 600;
        margin-top: 4px;
      }
      .pekan-progress {
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-top: 8px;
      }
      .pekan-progress.complete {
        color: var(--success);
        font-weight: 600;
      }

      .nav-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }
      .btn-back {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
        padding: 6px 12px;
        border-radius: 8px;
        cursor: pointer;
      }

      .section-title {
        font-size: 0.95rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin: 20px 0 10px 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .section-title.online {
        color: #60a5fa;
      }
      .section-title.offline {
        color: #f59e0b;
      }

      /* TASK CARD DENGAN CHECKBOX BULAT DI KANAN & ICON DI KIRI */
      .task-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px 16px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .task-card:hover {
        border-color: var(--primary);
      }

      .task-icon {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--icon-bg);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        flex-shrink: 0;
      }

      .task-info {
        flex: 1;
      }
      .task-matkul {
        font-weight: 600;
        font-size: 0.95rem;
      }
      .task-pertemuan {
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      /* CHECKBOX BULAT (KANAN) */
      .round-checkbox {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 2px solid var(--text-muted);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        flex-shrink: 0;
      }
      .task-completed .round-checkbox {
        background: var(--success);
        border-color: var(--success);
        color: white;
      }
      .task-completed .task-matkul,
      .task-completed .task-pertemuan {
        text-decoration: line-through;
        opacity: 0.5;
      }

      .badge-sks {
        font-size: 0.7rem;
        padding: 2px 6px;
        border-radius: 4px;
        background: var(--icon-bg);
        color: var(--text-muted);
        margin-left: 6px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div>
          <h1 id="appTitle">🎓 Dashboard Kuliah</h1>
          <div id="appSubtitle" class="sub-title">
            Kelas 07TPLE004 • Reguler C
          </div>
        </div>
        <div class="header-controls">
          <button class="btn-theme" onclick="toggleTheme()" id="themeBtn">
            🌙 Dark
          </button>
          <button class="btn-reset-user" onclick="resetMyProgress()">
            🔄 Reset
          </button>
        </div>
      </header>

      <div id="pekanListView">
        <div id="pekanGrid" class="pekan-grid"></div>
      </div>

      <div id="pekanDetailView" style="display: none">
        <div class="nav-header">
          <button class="btn-back" onclick="showPekanList()">←</button>
          <div>
            <h2 id="detailPekanTitle">Pekan 1</h2>
            <div id="detailPekanSubtitle" class="sub-title"></div>
          </div>
        </div>

        <div class="section-title online">💻 Online (Senin - Jumat)</div>
        <div id="onlineTasksList"></div>

        <div class="section-title offline">🏫 Offline / Tatap Muka (Sabtu)</div>
        <div id="offlineTasksList"></div>
      </div>
    </div>

    <script>
      // =========================================================================
      // CONFIG MASTER KULIAH (BISA DIGANTI TIAP SEMESTER BARU BERJALAN)
      // =========================================================================
      const SEMESTER_CONFIG = {
        title: "🎓 Dashboard Kuliah UNPAM",
        subtitle: "Kelas 07TPLE004 • Reguler C",
        startDate: new Date(2026, 7, 31), // 31 Agustus 2026 (Format Month 0-Index: 7 = Agustus)
        courses: [
          { id: "c1", name: "Kecakapan Antar Personal", sks: 2, period: 1 },
          { id: "c2", name: "Keamanan Komputer", sks: 2, period: 1 },
          { id: "c3", name: "Pemrograman Web II", sks: 3, period: 1 },
          { id: "c4", name: "Jaringan Nirkabel", sks: 2, period: 1 },
          { id: "c5", name: "Etika Profesi", sks: 2, period: 2 },
          { id: "c6", name: "Manajemen Proyek Informatika", sks: 2, period: 2 },
          {
            id: "c7",
            name: "Testing dan QA Perangkat Lunak",
            sks: 2,
            period: 2,
          },
          {
            id: "c8",
            name: "Arsitektur dan Organisasi Komputer",
            sks: 3,
            period: 2,
          },
        ],
      };

      const LOCAL_STORAGE_KEY = "unpam_user_progress_v2";
      const THEME_STORAGE_KEY = "unpam_theme_mode";
      let userProgress = {};
      let currentPekan = null;

      function initApp() {
        // Set Header Info
        document.getElementById("appTitle").textContent = SEMESTER_CONFIG.title;
        document.getElementById("appSubtitle").textContent =
          SEMESTER_CONFIG.subtitle;

        // Load Theme
        const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
        if (savedTheme === "light") {
          document.body.classList.add("light-mode");
          document.getElementById("themeBtn").textContent = "☀️ Light";
        }

        // Load User Progress
        const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (saved) userProgress = JSON.parse(saved);
        renderPekanGrid();
      }

      function toggleTheme() {
        document.body.classList.toggle("light-mode");
        const isLight = document.body.classList.contains("light-mode");
        document.getElementById("themeBtn").textContent = isLight
          ? "☀️ Light"
          : "🌙 Dark";
        localStorage.setItem(THEME_STORAGE_KEY, isLight ? "light" : "dark");
      }

      function saveProgress() {
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(userProgress));
      }

      function resetMyProgress() {
        if (
          confirm("Yakin mau mengosongkan semua centangan perkuliahan kamu?")
        ) {
          localStorage.removeItem(LOCAL_STORAGE_KEY);
          userProgress = {};
          renderPekanGrid();
          if (currentPekan) renderTasks();
        }
      }

      function getPekanDateRangeObj(pekanNum) {
        const startDate = new Date(SEMESTER_CONFIG.startDate);
        startDate.setDate(startDate.getDate() + (pekanNum - 1) * 7);

        const endDate = new Date(startDate);
        endDate.setDate(endDate.getDate() + 5); // Sabtu

        return { startDate, endDate };
      }

      function getPekanDateRangeStr(pekanNum) {
        const { startDate, endDate } = getPekanDateRangeObj(pekanNum);
        const opt = { day: "2-digit", month: "short" };
        const startStr = startDate.toLocaleDateString("id-ID", opt);
        const endStr = endDate.toLocaleDateString("id-ID", {
          ...opt,
          year: "numeric",
        });
        return `${startStr} - ${endStr}`;
      }

      function isPekanPassed(pekanNum) {
        const { endDate } = getPekanDateRangeObj(pekanNum);
        const today = new Date();
        // Set jam ke akhir hari Sabtu
        endDate.setHours(23, 59, 59, 999);
        return today > endDate;
      }

      function getAcademicWeekIndex(pekanNum) {
        if (pekanNum < 8) return pekanNum;
        if (pekanNum > 8) return pekanNum - 1;
        return 0; // UTS
      }

      function isMeetingOnline(course, mtgNum) {
        const isPreUTSPhase = course.sks === 2 ? mtgNum <= 7 : mtgNum <= 10;
        return isPreUTSPhase ? course.period === 2 : course.period === 1;
      }

      function generatePekanTasks(pekanNum) {
        const academicWeek = getAcademicWeekIndex(pekanNum);
        if (academicWeek === 0) return { online: [], offline: [] };

        const is3SksDouble = academicWeek % 2 === 0;
        let online = [];
        let offline = [];

        SEMESTER_CONFIG.courses.forEach((course) => {
          if (course.sks === 2) {
            const mtgNum = academicWeek;
            if (mtgNum <= 14) {
              const taskId = `p${pekanNum}_${course.id}_P${mtgNum}`;
              const taskObj = {
                id: taskId,
                courseName: course.name,
                sks: course.sks,
                meetingName: `Pertemuan ${mtgNum}`,
                isCompleted: !!userProgress[taskId],
              };

              if (isMeetingOnline(course, mtgNum)) online.push(taskObj);
              else offline.push(taskObj);
            }
          } else if (course.sks === 3) {
            let mtgList = [];
            if (is3SksDouble) {
              let baseMtg = (academicWeek / 2) * 3 - 1;
              mtgList.push(baseMtg, baseMtg + 1);
            } else {
              let baseMtg = Math.floor(academicWeek / 2) * 3 + 1;
              mtgList.push(baseMtg);
            }

            mtgList.forEach((mtgNum, idx) => {
              if (mtgNum <= 21) {
                const taskId = `p${pekanNum}_${course.id}_P${mtgNum}`;
                const taskObj = {
                  id: taskId,
                  courseName: course.name,
                  sks: course.sks,
                  meetingName: `Pertemuan ${mtgNum}`,
                  isCompleted: !!userProgress[taskId],
                };

                if (is3SksDouble && idx === 0) {
                  online.push(taskObj);
                } else {
                  if (isMeetingOnline(course, mtgNum)) online.push(taskObj);
                  else offline.push(taskObj);
                }
              }
            });
          }
        });

        return { online, offline };
      }

      function renderPekanGrid() {
        const grid = document.getElementById("pekanGrid");
        grid.innerHTML = "";

        for (let i = 1; i <= 16; i++) {
          const dateRange = getPekanDateRangeStr(i);
          const passed = isPekanPassed(i);

          if (i === 8) {
            const utsCard = document.createElement("div");
            utsCard.className = `pekan-card ${passed ? "passed" : ""}`;
            utsCard.style.borderColor = "#ef4444";
            utsCard.innerHTML = `
            <div class="pekan-num" style="color: #ef4444;">PEKAN 8</div>
            <div class="pekan-date" style="color: #fca5a5;">${dateRange}</div>
            <div style="font-size: 0.75rem; color: #ef4444; font-weight: 700; margin-top: 6px;">🔥 Ujian Tengah Semester (UTS)</div>
          `;
            grid.appendChild(utsCard);
            continue;
          }

          if (i === 16) {
            const uasCard = document.createElement("div");
            uasCard.className = `pekan-card ${passed ? "passed" : ""}`;
            uasCard.style.borderColor = "#22c55e";
            uasCard.innerHTML = `
            <div class="pekan-num" style="color: #22c55e;">PEKAN 16</div>
            <div class="pekan-date" style="color: #86efac;">${dateRange}</div>
            <div style="font-size: 0.75rem; color: #22c55e; font-weight: 700; margin-top: 6px;">🏆 Ujian Akhir Semester (UAS)</div>
          `;
            grid.appendChild(uasCard);
            continue;
          }

          const tasks = generatePekanTasks(i);
          const allTasks = [...tasks.online, ...tasks.offline];
          const doneTasks = allTasks.filter((t) => t.isCompleted).length;
          const isAllDone =
            allTasks.length > 0 && doneTasks === allTasks.length;

          const card = document.createElement("div");
          card.className = `pekan-card ${passed ? "passed" : ""}`;
          card.onclick = () => openPekanDetail(i);

          card.innerHTML = `
          <div class="pekan-num">Pekan ${i}</div>
          <div class="pekan-date">${dateRange}</div>
          <div class="pekan-progress ${isAllDone ? "complete" : ""}">
            ${isAllDone ? "✓ Selesai Semua" : `${doneTasks}/${allTasks.length} Selesai`}
          </div>
        `;
          grid.appendChild(card);
        }
      }

      function openPekanDetail(pekanNum) {
        currentPekan = pekanNum;
        document.getElementById("pekanListView").style.display = "none";
        document.getElementById("pekanDetailView").style.display = "block";

        document.getElementById("detailPekanTitle").textContent =
          `Pekan ${pekanNum}`;
        document.getElementById("detailPekanSubtitle").textContent =
          `Periode: ${getPekanDateRangeStr(pekanNum)}`;

        renderTasks();
      }

      function showPekanList() {
        document.getElementById("pekanDetailView").style.display = "none";
        document.getElementById("pekanListView").style.display = "block";
        renderPekanGrid();
      }

      function renderTasks() {
        const { online, offline } = generatePekanTasks(currentPekan);

        const onlineContainer = document.getElementById("onlineTasksList");
        const offlineContainer = document.getElementById("offlineTasksList");

        onlineContainer.innerHTML = online
          .map((t) => createTaskRowHTML(t, "💻"))
          .join("");
        offlineContainer.innerHTML = offline
          .map((t) => createTaskRowHTML(t, "🏫"))
          .join("");
      }

      function createTaskRowHTML(task, modeIcon) {
        return `
        <div class="task-card ${task.isCompleted ? "task-completed" : ""}" onclick="toggleTask('${task.id}')">
          <div class="task-icon">${modeIcon}</div>
          <div class="task-info">
            <div class="task-matkul">${escapeHtml(task.courseName)} <span class="badge-sks">${task.sks} SKS</span></div>
            <div class="task-pertemuan">${task.meetingName}</div>
          </div>
          <div class="round-checkbox">
            ${task.isCompleted ? "✓" : ""}
          </div>
        </div>
      `;
      }

      window.toggleTask = (taskId) => {
        userProgress[taskId] = !userProgress[taskId];
        saveProgress();
        renderTasks();
      };

      function escapeHtml(str) {
        return str.replace(
          /[&<>"']/g,
          (match) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[match],
        );
      }

      initApp();
    </script>
  </body>
</html>
